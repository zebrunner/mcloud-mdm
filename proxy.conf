# The MDM part of the proxy of a farm (README.md#infrastructure), nginx: an example for the proxy of MCloud. TLS is
# terminated here. Only the paths of the devices and of the device hosts are published, each from the fixed public
# addresses of the site of the farm: the devices and the nodes leave it by them. The admin UI of mcloud-mdm (:8081),
# the API of NanoHUB (:9004) and the web panel of Headwind MDM stay inside. Replace mcloud.example.com,
# mcloud-mdm.example.com, the certificates, the upstreams and the addresses.

# http { ...
geo $mdm_device_site {
  default 0;
  # the fixed public addresses of the site of the farm (the devices and the device hosts)
  203.0.113.10/32 1;
}

# the domain of the farm (the server of MCloud): add these locations to it
server {
  listen 443 ssl;
  server_name mcloud.example.com;
  ssl_certificate /certs/fullchain.pem;
  ssl_certificate_key /certs/privkey.pem;

  # iOS: the MDM protocol (NanoHUB checks the signature of the device identity of every request)
  location ~ ^/(mdm|checkin)$ {
    if ($mdm_device_site = 0) {
      return 403;
    }
    proxy_set_header Host $host;
    proxy_pass http://mdm-nanohub:9004;
  }
  # SCEP (one-time challenges), the enrollment of the device hosts (MDM_ENROLL_TOKEN): /mdm/enroll, /android/enroll,
  # /android/release (it returns the secret of the agents), the agent APK
  location ~ ^/(scep|mdm/enroll|android/(enroll|release|agent\.apk))$ {
    if ($mdm_device_site = 0) {
      return 403;
    }
    proxy_set_header Host $host;
    proxy_pass http://mdm:8080;
  }
  # ... the locations of MCloud; the admin UI (http://mdm:8081) only behind its authentication (LDAP)
}

# Headwind MDM for the Android agents: a host of its own (HMDM_PUBLIC_URL), e.g. demo-mdm.zebrunner.farm (the
# wildcard certificate of zebrunner.farm covers one level). Only the paths of the agents: the web panel and the API of
# the admins (/rest/private, /rest/public/jwt/login) stay inside, mcloud-mdm reaches them at http://hmdm:8080.

server {
  listen 443 ssl;
  server_name mcloud-mdm.example.com;
  ssl_certificate /certs/fullchain.pem;
  ssl_certificate_key /certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  if ($mdm_device_site = 0) {
    return 403;
  }
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;

  # the configuration and the device info (signed by the agents: secure.enrollment)
  location ~ ^/rest/public/sync/(configuration/[^/]+|info)$ {
    proxy_pass http://hmdm:8080;
  }
  # the long polling of the push messages (a fallback of MQTT)
  location ~ ^/rest/(notification/polling|notifications/device)/[^/]+$ {
    proxy_pass http://hmdm:8080;
  }
  # the plugins the agent reports to: the device info, its log and the log rules
  location ~ ^/rest/plugins/(deviceinfo/deviceinfo/public|deviceinfo/deviceinfo-plugin-settings/device|devicelog/log/list|devicelog/log/rules)/[^/]+$ {
    proxy_pass http://hmdm:8080;
  }
  # the files of the configurations (APKs)
  location /files/ {
    limit_except GET HEAD {
      deny all;
    }
    proxy_pass http://hmdm:8080;
  }
  location / {
    return 404;
  }
}
# ... }

# stream { ...
# MQTT over TLS: the agents connect to ssl://<host of HMDM_PUBLIC_URL>:31443 (HMDM_MQTT_PORT)
server {
  listen 31443 ssl;
  ssl_certificate /certs/fullchain.pem;
  ssl_certificate_key /certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  # the same addresses as above
  allow 203.0.113.10/32;
  deny all;
  proxy_pass hmdm:31000;
}
# ... }
