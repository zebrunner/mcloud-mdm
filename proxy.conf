# The MDM part of stf-proxy, the proxy of MCloud (README.md#mcloud), nginx: everything on the domain of the farm, no DNS
# name or certificate of its own. TLS is terminated by stf-proxy. Published, and only from the fixed public addresses of
# the site of the farm (its devices and its nodes leave it by them):
# - iOS: /mdm, /checkin (NanoHUB), /scep (one-time challenges);
# - Android: /hmdm/... (only the paths of the agents of Headwind MDM) and MQTT over TLS on 31443;
# - the nodes: /mdm/enroll, /mdm/status, /mdm/release, /android/enroll, /android/status, /android/release with their
#   MCloud node token (MCLOUD_NODE_TOKEN of
#   mcloud-agent): stf-api checks it (GET /api/v1/nodes/self), stf-proxy then sends the MDM_ENROLL_TOKEN of the server,
#   the nodes never get it; /android/agent.apk.
# The admin UI of mcloud-mdm is not published by default: 127.0.0.1:<port> of the server, an ssh tunnel. Optionally
# (MDM_ADMIN_PUBLIC=true of MCloud) it is /mcloud/mdm/ for the admins of STF (/_hub_auth/admin of stf-proxy): the last
# locations below. The API of NanoHUB (:9004), the device listener of mcloud-mdm (:8080) and the web panel of Headwind
# MDM are never published.
# Replace 203.0.113.10/32 (the addresses of the site) and MDM_ENROLL_TOKEN (the setup of MCloud renders them).

# http { ...
geo $mdm_device_site {
  default 0;
  # the fixed public addresses of the site of the farm (the devices and the nodes)
  203.0.113.10/32 1;
}

# server { ... the server of the domain of the farm (stf-proxy)

  # iOS: the MDM protocol (NanoHUB checks the signature of the device identity of every request)
  location ~ ^/(mdm|checkin)$ {
    if ($mdm_device_site = 0) {
      return 403;
    }
    proxy_set_header Host $host;
    set $upstream_nanohub mdm-nanohub:9004;
    proxy_pass http://$upstream_nanohub;
  }

  # SCEP: a one-time challenge of an enrollment profile signs one device identity
  location = /scep {
    if ($mdm_device_site = 0) {
      return 403;
    }
    proxy_set_header Host $host;
    set $upstream_mdm mdm:8080;
    proxy_pass http://$upstream_mdm;
  }

  # the agent APK: no secret in it
  location = /android/agent.apk {
    if ($mdm_device_site = 0) {
      return 403;
    }
    set $upstream_mdm mdm:8080;
    proxy_pass http://$upstream_mdm;
  }

  # the nodes: their MCloud node token, then the enrollment token of the server
  location ~ ^/(mdm/(enroll|status|release)|android/(enroll|status|release))$ {
    if ($mdm_device_site = 0) {
      return 403;
    }
    auth_request /_mdm_node_auth;
    proxy_set_header Host $host;
    proxy_set_header Authorization "Bearer MDM_ENROLL_TOKEN";
    set $upstream_mdm mdm:8080;
    proxy_pass http://$upstream_mdm;
  }
  location = /_mdm_node_auth {
    internal;
    set $upstream_node_auth stf-api:3000;
    proxy_pass http://$upstream_node_auth/api/v1/nodes/self;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host stf-proxy;
  }

  # Android: Headwind MDM under /hmdm (HMDM_PUBLIC_URL = <MDM_PUBLIC_URL>/hmdm), the paths of the agents only: the
  # configuration and the device info (signed: secure.enrollment), the long polling, the plugins they report to,
  # the files of the configurations
  location ~ ^/hmdm/(rest/public/sync/(configuration/[^/]+|info)|rest/(notification/polling|notifications/device)/[^/]+|rest/plugins/(deviceinfo/deviceinfo/public|deviceinfo/deviceinfo-plugin-settings/device|devicelog/log/list|devicelog/log/rules)/[^/]+|files/[^/]+)$ {
    if ($mdm_device_site = 0) {
      return 403;
    }
    rewrite ^/hmdm(/.*)$ $1 break;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    set $upstream_hmdm hmdm:8080;
    proxy_pass http://$upstream_hmdm;
  }
  location ^~ /hmdm/ {
    return 404;
  }

  # OPTIONAL (MDM_ADMIN_PUBLIC=true): the admin UI of mcloud-mdm for the admins of STF; Host stays the one of the
  # browser (the UI checks its Origin). Without them: ssh -L 9101:127.0.0.1:9101 <server>, http://127.0.0.1:9101
  location = /mcloud/mdm {
    return 302 /mcloud/mdm/;
  }
  location /mcloud/mdm/ {
    auth_request /_hub_auth/admin;
    error_page 401 = @console_sign_in;
    rewrite ^/mcloud/mdm(/.*)$ $1 break;
    # with its port: the UI compares it with the Origin of its POSTs (CSRF)
    proxy_set_header Host $http_host;
    set $upstream_mdm_admin mdm:8081;
    proxy_pass http://$upstream_mdm_admin;
  }

# ... }
# ... }

# stream { ...
# MQTT over TLS: the agents connect to ssl://<host of the farm>:31443 (HMDM_MQTT_PORT), the certificate of stf-proxy
server {
  listen 31443 ssl;
  ssl_certificate /etc/nginx/ssl/ssl.crt;
  ssl_certificate_key /etc/nginx/ssl/ssl.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  # the same addresses as $mdm_device_site
  allow 203.0.113.10/32;
  deny all;
  resolver 127.0.0.11 valid=30s;
  set $upstream_mqtt hmdm:31000;
  proxy_pass $upstream_mqtt;
}
# ... }
